defaults:
  adapter_type: "3_4"
  spray_rod_type: "200_1x10"

frames:
  parent: Link6
  controller_tool: Arm_Tip
  motion_tcp: plasma_motion_tcp
  nozzle_tip: plasma_nozzle_tip
  spray_outlet: plasma_spray_outlet

# The motion TCP is the center of the physical side outlet on the rod surface.
# The rounded distal end is retained only for bottom-clearance calculations.
process_geometry:
  tip_to_outlet_near_edge_m: 0.003
  motion_tcp_rpy_in_rod: [1.5707963267948966, 0.0, 1.5707963267948966]
  shaft_outer_radius_m:
    "3_4": 0.002
    "6_8": 0.004

# CAD assembly coordinates are expressed in meters and extend along local +Y.
# The complete CAD assembly is mounted with Rx(+90 deg), mapping local +Y to
# Link6 +Z. The final Rx(-90 deg) makes Arm_Tip axes coincide with Link6 axes.
assembly:
  mount_xyz: [0.0, 0.0, 0.0]
  mount_rpy: [1.5707963267948966, 0.0, 0.0]
  adapter_xyz: [0.0, 0.078, 0.0]
  adapter_rpy: [0.0, 0.0, 0.0]
  # The physical rod is 210 mm long and exposes 200 mm outside the gun body.
  # The installed stack is 8 mm flange plate + 70 mm fixed cover + 40 mm
  # gun head. The adapter origin is after the first 78 mm, so the visible rod
  # origin is another 40 mm forward: 118 mm from Link6.
  rod_xyz: [0.0, 0.040, 0.0]
  rod_rpy: [0.0, 0.0, 0.0]
  tcp_rpy: [-1.5707963267948966, 0.0, 0.0]

